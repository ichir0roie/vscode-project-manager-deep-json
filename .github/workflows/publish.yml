# main に push されたとき、package.json の version に対応するタグが無ければ
# Marketplace に publish してタグを打つ。version を上げていなければ何もしない。
name: publish

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: xvfb-run -a npm test

  publish:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # タグ済み、または Marketplace に同じ version が既にあれば skip する
      - name: Check whether this version is already published
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          published=$(npx vsce show ichir0roie.project-manager-deep-json --json | node -p "JSON.parse(require('fs').readFileSync(0)).versions[0].version")
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "v$version is already tagged; skipping publish"
            echo "publish=false" >> "$GITHUB_OUTPUT"
          elif [ "$published" = "$version" ]; then
            echo "v$version is already on the Marketplace; tagging only"
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "tag=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish to Marketplace
        if: steps.version.outputs.publish == 'true'
        run: npx vsce publish -p "$VSCE_PAT"
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Tag release
        if: steps.version.outputs.tag == 'true'
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"
